name: Build and publish Meraki HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meraki-html-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE: surenfernando/meraki-html
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Validate website links and assets
        run: python3 deploy/check_site.py

      - name: Check Docker Hub username
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Add the DOCKERHUB_USERNAME repository secret first."
            exit 1
          fi
          if ! printf '%s' "$DOCKERHUB_USERNAME" | grep -Eq '^[a-z0-9][a-z0-9_-]*$'; then
            echo "Use your lowercase Docker Hub username, not your email address."
            exit 1
          fi
          if [ "$DOCKERHUB_USERNAME" != "surenfernando" ]; then
            echo "DOCKERHUB_USERNAME must be surenfernando to publish surenfernando/meraki-html."
            exit 1
          fi

      - name: Build image on GitHub
        run: |
          docker build --platform linux/amd64 \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$GITHUB_SHA" .

      - name: Start container for smoke check
        run: |
          docker run -d --name meraki-smoke \
            -p 127.0.0.1:8088:80 \
            "$IMAGE:$GITHUB_SHA"
          docker exec meraki-smoke nginx -t
          python3 deploy/check_site.py --url http://127.0.0.1:8088

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested image
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Clean up smoke container
        if: always()
        run: docker rm -f meraki-smoke || true
